<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="pixra/32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="pixra/16.png" sizes="16x16" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Alternative orthographies for the Lojban logical language" />
    <link rel="apple-touch-icon" href="pixra/192.png" />
    <title>melbi zei lojban</title>
  </head>
  <body class="h-full bg-slate-50 text-slate-900 transition-colors duration-200 dark:bg-slate-950 dark:text-slate-100">
    <div id="app" class="flex min-h-full flex-col">
      <!-- Header -->
      <header class="sticky top-0 z-40 w-full border-b border-slate-200 bg-white/80 backdrop-blur transition-colors dark:border-slate-800 dark:bg-slate-900/80">
        <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-2xl">
              melbi zei lojban
            </h1>
          </div>
          <button id="theme-toggle" class="rounded-lg p-2.5 text-sm text-slate-500 hover:bg-slate-100 focus:outline-none focus:ring-4 focus:ring-slate-200 dark:text-slate-400 dark:hover:bg-slate-700 dark:focus:ring-slate-700">
            <!-- Sun Icon (visible in light mode) -->
            <svg id="theme-toggle-light-icon" class="hidden h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
            </svg>
            <!-- Moon Icon (visible in dark mode) -->
            <svg id="theme-toggle-dark-icon" class="hidden h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <main class="flex-grow px-4 py-8 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-4xl space-y-8">
          
          <!-- Controls Card -->
          <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm transition-colors dark:border-slate-800 dark:bg-slate-900">
            <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
              <!-- Text Input -->
              <div class="sm:col-span-2 lg:col-span-3">
                <label for="text-input" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Text Content</label>
                <div class="relative">
                  <input type="text" id="text-input" placeholder="Enter Lojban text..." class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-2.5 pr-20 text-sm text-slate-900 focus:border-blue-500 focus:ring-blue-500 dark:border-slate-600 dark:bg-slate-800 dark:text-white dark:placeholder-slate-400 dark:focus:border-blue-500 dark:focus:ring-blue-500" />
                  <button id="sample-text-btn" class="absolute right-1 top-1 bottom-1 flex items-center rounded-md bg-white px-3 text-xs font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 dark:bg-slate-700 dark:text-white dark:ring-slate-600 dark:hover:bg-slate-600">
                    Sample
                  </button>
                </div>
              </div>

              <!-- Font Select -->
              <div>
                <label for="font-select" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Font</label>
                <select id="font-select" class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-2.5 text-sm text-slate-900 focus:border-blue-500 focus:ring-blue-500 dark:border-slate-600 dark:bg-slate-800 dark:text-white dark:focus:border-blue-500 dark:focus:ring-blue-500"></select>
              </div>

              <!-- Size Slider -->
              <div>
                <div class="flex items-center justify-between">
                  <label for="size-slider" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Size</label>
                  <span id="size-value" class="mb-2 text-sm font-bold text-blue-600 dark:text-blue-400">50px</span>
                </div>
                <input type="range" id="size-slider" min="20" max="200" step="1" value="50" class="h-2 w-full cursor-pointer appearance-none rounded-lg bg-slate-200 dark:bg-slate-700" />
              </div>
            </div>
          </div>

          <!-- Canvas Display Card -->
          <div class="relative overflow-hidden rounded-xl border border-slate-200 bg-white p-6 shadow-md transition-colors dark:border-slate-800 dark:bg-slate-900">
            <div id="render-container" class="relative flex min-h-[150px] items-center justify-center rounded-lg border border-dashed border-slate-300 bg-slate-50/50 p-4 dark:border-slate-700 dark:bg-slate-800/50">
              <!-- Loading Overlay -->
              <div id="loading-spinner" class="absolute inset-0 z-10 flex hidden items-center justify-center bg-white/60 backdrop-blur-[2px] dark:bg-slate-900/60">
                 <svg class="h-10 w-10 animate-spin text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
              </div>

              <!-- Canvas (hidden, used for export) -->
              <canvas id="main-canvas" class="hidden"></canvas>
              
              <!-- Skeleton Div -->
              <div id="skeleton-div" class="h-[150px] w-full animate-pulse rounded-lg bg-slate-200 dark:bg-slate-700"></div>
              
              <!-- Result Image -->
              <img id="result-image" src="" alt="Alternative Lojban orthography render" class="hidden max-w-full rounded-lg shadow-sm border border-slate-200 dark:border-slate-700" />
            </div>
            <p id="empty-state" class="mt-4 text-center text-xs text-slate-500 dark:text-slate-400">
              The preview above dynamically updates. Long press or right click to save the image.
            </p>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="mt-auto border-t border-slate-200 py-6 transition-colors dark:border-slate-800">
        <div class="mx-auto max-w-7xl px-4 text-center text-sm text-slate-500 dark:text-slate-400">
          <p>© 2026 melbi zei lojban - Refactored to bare HTML/TS</p>
        </div>
      </footer>
    </div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
